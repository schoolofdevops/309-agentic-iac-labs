name: Section 10 guarded Terraform plan

on:
  pull_request:
    paths:
      - "section-10/terraform/**"

permissions:
  contents: read

concurrency:
  group: section-10-terraform-plan
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin source: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out approved evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      # Pin source: https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: Bind setup-action Terraform
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          engine_source="$(command -v terraform)"
          engine_root="$(mktemp -d /tmp/agentic-iac-s10-engine-XXXXXX)"
          /usr/bin/install -m 0500 "$engine_source" "$engine_root/terraform"
          engine_sha="$(sha256sum "$engine_root/terraform" | cut -d ' ' -f 1)"
          printf 'S10_ENGINE_PATH=%s\n' "$engine_root/terraform" >> "$GITHUB_ENV"
          printf 'S10_ENGINE_SHA256=%s\n' "$engine_sha" >> "$GITHUB_ENV"

      - name: Evaluate reviewed plan
        run: >-
          node trusted/section-10/scripts/run-reviewed-plan.mjs
          --engine terraform
          --engine-path "$S10_ENGINE_PATH"
          --engine-sha256 "$S10_ENGINE_SHA256"
          --source candidate
          --manifest "$RUNNER_TEMP/reviewed-change.json"
          --output /tmp/agentic-iac-s10-plan-evidence

      # Pin source: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: section-10-terraform-plan
          path: /tmp/agentic-iac-s10-plan-evidence
          if-no-files-found: error
          retention-days: 7
